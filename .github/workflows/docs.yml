name: Documentation

# The player's guide (docs/): built on every push to master that touches it and on every release
# tag, and published to GitHub Pages: what is on master at the site's root, each release beside it
# (tools/build_docs.py). A pull request builds it without publishing. As DAOTurnBased's.
on:
  push:
    branches: [master]
    paths: ['docs/**', 'tools/build_docs.py', '.github/workflows/docs.yml']
    # A release tag adds its version to the selector.
    tags: ['v*']
  pull_request:
    paths: ['docs/**', 'tools/build_docs.py', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Every tag, for each release's guide; a tag's push builds the whole site from master.
          fetch-depth: 0
          ref: ${{ startsWith(github.ref, 'refs/tags/') && 'master' || github.ref }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: docs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: mkdir -p build && python tools/build_docs.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/docs-site/DAOElgaraShaders

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
