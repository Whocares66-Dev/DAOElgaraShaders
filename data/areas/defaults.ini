; What an area's file does not say (README.md).
; An early summer's sun. The village's noon sun (38 degrees up) gives the latitude as an equinox's noon
; (52 degrees), and an equinox's sun set at 18:00: at 19:00 it was 9 degrees under, the level in deep
; dusk, "way too dark for 7:00 PM" (the user, 2026-10-22, who chose summer days). At 18 degrees it is 56
; up at noon, higher than the level's own.
declination = 18
; A summer's clock, an hour on from the sun's (as clocks keep summer time). At 12 it rose about 04:20 and
; at 4:00 the morning was light already (the user, 2026-10-22: "sun rises too early"); at 13 it rises
; about 05:20 and sets about 20:40.
noon = 13
; One latitude for the whole world, Redcliffe's: an area's own sun gives its own (its height is 13 to 65
; degrees, so 25 to 77 north), and a sunset's hour would differ between areas, as the castle's did from the
; village's (the user, 2026-10-22: "match up the time based on the elevation of the Sun"). Each level's
; own sun stands at the hour it is that high on this latitude (issue 37).
latitude = lak100d
; The moon lights the night, and the night sky, a dim light of its own, keeps what the moon does not reach
; from black. With none the shadows were pitch black, figures lost in them and the game's highlight of what
; can be used (Tab) gone with them; at 0.15 they were still "maybe too dark" (the user, 2026-10-22, in
; Redcliffe's village). Redcliffe's shadows are the measure for every area (the user, 2026-10-23: "we want
; the shadows to be about as dark everywhere"). The user chose 0.8 for Lothering and Haven's mountain top, then
; for most areas (2026-10-24: "We probably want to default fill 0.8 most places").
night_fill = 0.8
; The castle's layouts light its torches (torch_baked, torch_animated) beside the makers' sunlight
; (Sunhighlight) and a bounce of the day's sky (amb_bounce_RT), which go with the sun as the village's
; Hotspots do (ghilana, 2026-10-22). Lothering's (hrt000d) name theirs fire_: its refugee bonfire's
; (fire_big_001_RT, 12 m) and a lamp's (fire_lamp_), beside its sun_bounce, vista_sun_bounce and
; amb_bounce; under `torch` alone they went with the sun, and the bonfire lit nothing at night (the user,
; 2026-10-23: "fire gives off no light").
fires = torch fire
; The starts of the names of the layouts' lights that are lamps beside the fires: they burn by night as by day, and
; where one lights the flames about it the plugin's night of them takes its place by night (EffectLights.cpp). Told
; by name, not by colour: by red over green over blue the chantries' sunlight (Window_01Baked, glass_bounce) and the
; portraits' rig were lamps (2026-10-30). Read in the levels' layouts: the Circle tower's candle_001_RT, Cndl_RT and
; lamp_001_RT (lak503d), Redcliffe's chantry's Candle_01RT (lak106d) and lamp_001 (lak110d).
lamps = candle cndl lamp lantern
; How hazy the night's sky is, from 0, the night level's clear air (Redcliffe's deep blue), to 1, the area's
; own haze and clouds as it has them by day; as dark either way, and the night's moon and light either way.
night_haze = 0
; How much of the moon's light an area's spray and mist (effects.ini's `lit`) take by night, 0 to 1, beside the
; night sky's: the plugin shadows the moon on surfaces, not on a particle, so spray under trees took the whole
; moon and stood white beside ground all but black (the West Brecilian Forest's falls, 0.56 of noon at midnight;
; the user, 2026-10-24: "the dimming of particular surfaces should be a config in the area-specific file").
; An area whose spray stands in the open moon may say 1.
effects_moonlit = 0
; How much of the moon's light an area's water (a lake's, a river's, a fall's: the water shaders) takes by night, 0 to
; 1, beside the night sky's: as with its spray, the moon is shadowed on the ground and not on the water, so a stream
; under trees took the whole moon and ran white past moss all but black (the West Brecilian Forest's, #63). Water in
; the open moon keeps it, 1; an area whose water is under a canopy may say 0.
water_moonlit = 1
; How bright the plugin lights fires and lamps, a share of their own light (the level's layouts' lamps
; and effects.ini's glows). Lit each pixel after the shadow, the level makers' lamps are brighter than
; the engine reckoned them by the vertex: by Lothering's Dane's Refuge at 23:30 the lamp added 26 of 255
; to the porch, more than it did by day (16), and the night porch (52.5) was nearly as bright as the day's
; (56.4) (the user, 2026-10-23: "lamp also a little too bright compared to no day / night").
fire_strength = 1
; The moon's height at midnight, degrees, or `own` for the night level's own moon's (Redcliffe's, 28 up). At 28 it
; stood behind the canopy and the walls: the Brecilian forests, the Frostback pass and Denerim's streets were near
; black at midnight, and at 60 lit with their shadows (the user, 2026-10-24: "60 seems good. That should probably be
; the default. Direction depends on the scene and which side has objects like walls that might block things. The goal
; is not to maximize brightness but to have a good balance between light and shadow"). An area's `moon_turn` says
; from where, by its scene.
moon_height = 60
; An interior's (an area whose file names its `outside`): how much of its makers' light it keeps at night, the share of
; its bake, its ambient colour, its probes, its layouts' lamps that are not fires and its figures' fills and key light
; that no fitting or window of its own motivates; whole by day, whichever of day and night its makers baked. The relit
; tower of 2026-10-11 had none of it, and away from a light it was close to black (#4); the user, 2026-10-25: "That's
; probably too dark. We can try reducing fill light to different levels to see what's an appropriate level of
; darkness" (outdoors.tune's Fill tries another). Shown 0.25, 0.5, 0.75 and 1 in the Circle tower at 12:00, 19:30 and
; midnight, the user chose a half (2026-10-25: "Fill 0.5 is probably sufficient"), then had it whole by day ("Should be
; darker at night. Shouldn't be blue during the day").
fill = 0.5
; An interior's windows: the light of a square metre of opening, a share of the light out of doors at the hour (the sun's
; or the moon's and the sky's together), and how far it reaches, metres; the same for every interior's windows
; (outdoors.tune's Window and WindowReach try others). The Circle tower's are 33 square metres each, their middles 16.6 m
; over the floor, and at 20 m their light did not reach it. Set so that at the makers' own hour, midnight, with half
; their light kept, the tower's first floor is about as bright as vanilla's (its start hall 69, 42, 60 of 255 against 68,
; 44, 77; its hall by the children 19 against 22; 2026-10-25): at 0.05 it was half as bright again, at 0.3 a white wash.
window = 0.03
window_reach = 40
; An interior's beams of light, the starts of their effects' names: each is an opening of the level's windows' mean
; size, where the light comes in, facing the way the beam goes, lit as a window is; the daylight of a room no window
; reaches, as the level's makers drew it (the user, 2026-10-25, of the windows carrying daylight to Witch Hunt's
; library and the dormitories: "Go ahead and try what you suggested").
beams = fxe_sunbeam fxe_moonbm
