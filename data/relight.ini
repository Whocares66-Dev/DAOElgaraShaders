; The levels Elgara Shaders lights again, and how: what tools\relight.ps1
; hands elgarashaders_relight for each. [default] is every level's; a
; level's own section is read after it. src\RelightTool.cpp's head has what
; each value is.
;
; A level is here once it has been looked at in play, from several places.
; The numbers are judgements, each with the day's word it answers.

[default]
side = 256
surfaces = 0.5
bounces = 2
rays = 48
furthest = 60
; The colours of fire and lava here are a fire's as a picture has it, a warm
; orange with green at six tenths of red and blue near three: at half and a
; sixth they were a pure orange on every stone (the user, 2026-10-11: "in
; general saturation seems too high").
;
; What lights a level is its fittings, each by what kind of thing it is, and
; not the lights its makers left in its files, whose colours and reaches
; were set to tint a fitting and say nothing of how bright it is (the user,
; 2026-10-11: "intensity should be by object type, lamp > candle, not by
; color"; "favor motivated lighting, practical lights, avoid ambient lights,
; global fill lights"). So `lamps = 0`: none of the level's own.
;
; A fitting is a model a room places, known by its name; its three numbers
; are its light in red, green and blue (a surface that faces it from a metre
; and a half off gets a little under a quarter of them), and the last how far
; it carries. A rule earlier in the list comes first: the candle inside a
; lantern is the lantern's.
;   a brazier's fire (fxe_fire_lrg_p)   16, a fire's orange
;   a small fire (fxe_fire_small_p)      10: a cairn's fire by a gate at 4 left
;                                        the ground about it dark
;   a lantern (prp_ferlamp_*)            3.5 warm
;   a candle's flame (fxe_fire_cnd_p)    0.8 each; a chandelier's ring is the
;                                        sum of its flames, ten at the most
lamps = 0
; A fire burns above the bowl it is placed in the bottom of: after its reach,
; how many metres above its place its light is, and how far about it nothing
; shadows it (the bowl's own size).
; A brazier's fire is a bonfire, twenty candles. At 6 two of them eight
; metres from Orzammar's great doors left the doors in the dark, and all 45
; lit a thirtieth of the level; at 40 and carrying forty metres they lit all
; of it alike (the user, 2026-10-11: "things look really flat").
flame = fire_lrg:16,9.6,4.5:30:2:3.5
flame = fire_small:10,6.0,2.8:20:0.7:1.6
; A fire of a middling size (a campfire, a fire in a pit) and a torch in a
; bracket, by the same scale: 12 and 6.
flame = fire_medium:12,7.2,3.4:26:1.0:2.0
flame = fire_m_ns:12,7.2,3.4:26:1.0:2.0
flame = fire_trch:6,3.6,1.7:20:0.3:0.8
flame = ferlamp:3.5,2.3,1.0:20
flame = fire_cnd:0.8,0.48,0.2:14

; The mage origin's Circle. Visited by night: "a sort of pale moonlit feel,
; punctuated by the warm Glow of candles and lamps" (the user, 2026-10-11).
; Its windows are the moon. Lamps at their own colour, a little further:
; at 1.8 times and 1.7 times as far it was "way too ... bright", at their own
; reach and cut at white "way too dark".
[lak303d]
; The moon comes in aslant through the windows that face it and lands as
; patches, shaded by their tracery. Nothing glows: a window's model is its
; gilded bars, and with those glowing the sill beside them was neon.
beam = window:0.2,0.25,0.36:0.7,0.4,-0.4
; And the night sky through every window, into the room and downward: a soft
; pale pool under each, whichever way it faces.
sky = window:9,11.5,16
; And what its makers drew for a sunlit day is made the moon's (the user,
; 2026-10-11: "moonbeam should be silver, not gold ... window should also be
; silver-blue"). These are tools\tint_level.py's lines. Each window's shaft
; of light is the effect fxe_sunbeam_*_p, gold: its glow and its beams take
; a colour from the room that places them, and its dust does not, so the
; rooms place a copy of the effect with the dust's colour changed. The
; numbers are what turn that gold to silver, blue raised and red lowered.
; The glass (the Circle tower's alone) is redrawn in its own brightness.
param = fxe_glow_color:0.55,0.85,2.4
param = fxe_startbeam_color:0.55,0.85,2.4
param = fxe_endbeam_color:0.55,0.85,2.4
model = fxe_sunbeam_w_p:fxe_lunbeam_w_p:dust:0.55,0.85,2.4
model = fxe_sunbeam_s_p:fxe_lunbeam_s_p:dust:0.55,0.85,2.4
texture = prp_tci_wind_smd:0.78,0.9,1.15
texture = prp_tci_wind_sme:0.78,0.9,1.15
bounces = 3
surfaces = 0.6

; Orzammar's Commons. "There should be a lot of glowing light from the lava,
; less of an ambient light" (the user, 2026-10-11). By the same rules as the
; tower: its 45 torches and 7 small fires are its lamps, each a fire by its
; kind, and its lava (the material hro_anvil_lava, on hro_lava* and dne_lava*)
; glows; none of its makers' own lights is taken, the four of a hundred
; metres that were the hall's colour least of all.
[orz100d]
; The game's own lightmaps here are up to 1024 a side: at 256 a step's riser
; had no texel of its own.
side = 512
; Rock sends on two fifths of its light, twice. At two thirds and four times,
; set to bring light to the hall's far ends, what came off the rock was twice
; what came from the lava and the fires, the same everywhere: a fill by
; another name, and the hall was flat (the user, 2026-10-11).
surfaces = 0.4
bounces = 2
; The lava an orange and not a red: at 5, 1.6, 0.25 the hall was one red from
; end to end (seen 2026-10-11). And the houses' lit windows glow the warm
; pink their panes are drawn in (the material prp_dw_window_01, whose emissive
; texture is 0.9, 0.5, 0.45 at its brightest; forty of them, three to five
; metres across, each in a facade piece dne_window* that is wall and does not
; glow). At 2, 1.5, 1.2 they lit nothing a metre off.
glow = anvil_lava:6.0,3.0,0.9
glow = dw_window:10,5.3,4.7
; Its lyrium crystals (prp_dw_crystal*, the material prp_dwcryst01, a grey
; stone in the game) glow a cold blue-white: the one cool light in a city of
; fire (the user, 2026-10-11: "That's a good idea. Make it so"). The Commons
; has thirteen, ten of them on one stall; the Diamond Quarter none.
; (At 7, 11, 16 the stall they stand on was washed white: "way too white.
; and bright". A deep blue at under a third of that.)
; By the models' own names, the shards alone (prp_dw_crystal1, eleven, and
; the one great prp_dw_crystal3): prp_dw_crystal2 is a tub of the same grey
; stuff, which glowing was a bucket of blue light ("i think it's just dirt").
; A shard is a hand across, so it glows hard to light anything: at 1.2, 3,
; 6.5 the two by the Deep Roads' gate were bright themselves and lit
; nothing ("the crystals glow but no light emitted"). The last number keeps
; the shard's own face what it was.
; (At 3, 8, 20 a probe a metre from the gate's two had 0.13 of blue: nothing
; to see. A shard at 8, 20, 50; the one great crystal, two metres of it, far less.)
glow = dw_crystal1:8,20,50:0.03
glow = dw_crystal3:2,5,12:0.13
; The Chantry's two stained windows (prp_chi_window_01) send their pink
; (the user, 2026-10-11: "pink light coming from them").
glow = chi_window:3.5,1.5,2.8
; Its makers' smoke and shafts of light are drawn as bright as a hall with
; an ambient light wanted them: over a hall lit again the smoke was a white
; cloud across the chasm. The smoke is the lava's colour and dim; the great
; glow overhead and the shaft of light from the roof, which no fitting
; gives, are all but put out. (tools\tint_level.py's lines.)
param = lava_add_color:0.45,0.2,0.05
param = lava_blend_color:0.28,0.16,0.09
param = fxe_glow_color:0.1,0.05,0.025
param = beam_color:0.08,0.07,0.06

; Orzammar's Diamond Quarter: the same city, the same fittings (44 braziers,
; the same lava, 84 lit windows), and so the Commons' values.
[orz300d]
side = 512
surfaces = 0.4
bounces = 2
glow = anvil_lava:6.0,3.0,0.9
glow = dw_window:10,5.3,4.7
param = lava_add_color:0.45,0.2,0.05
param = lava_blend_color:0.28,0.16,0.09
param = fxe_glow_color:0.1,0.05,0.025
param = beam_color:0.08,0.07,0.06

; Aeducan Thaig, in the Deep Roads (the user, 2026-10-11: "let's do aeducan
; thaig next"). A level of rooms. Its light is the lava in the channels of
; its floors (the material lav_lakemidtone on the Deep Roads' own floor
; pieces, 33 of them) and its three dark lakes (lav_lakedark, dimmer), a
; dozen fires, and sixteen shafts of light its makers let down through the
; roof (fxe_sunbeam_s_p warm, fxe_moonbm_* cold): each shaft is a light where
; it comes in, or it would be a beam in the air that lit nothing.
[orz701d]
side = 512
surfaces = 0.4
bounces = 2
glow = anvil_lava:6.0,4.2,2.6
; (At 3.5 the walls beside the channels were a hot orange and the walk
; between them dark; the light is moved from the surface to the bursts.)
; Vanilla's bake of this level is a gold, 1 : 0.77 : 0.59, and not the orange
; of the Commons (1 : 0.54 : 0.30): its lava's light is that gold here
; (tools\check_relit.py says both).
glow = lav_lakemidtone:2.0,1.4,0.9
glow = lav_lakedark:1.2,0.8,0.5
; Where the lava bursts (fxe_lava_burble, 45 of them along the channels) it
; throws its light up and about: a light a metre and a half over each. The
; lava's own surface lies level with the floor and sends that floor nothing,
; which left the entrance hall with hot walls, a black floor and a black
; party (toured 2026-10-11); its makers had lit the floor there with lamps
; of the lava's colour hung over the channels.
flame = lava_burble:14,10,6.5:26:2.0:1.5
; The shafts are a pale blue, all of them, the one cool light against the
; lava (the user, 2026-10-11: "those should offer some pale blue to break up
; the lava glow"). A shaft's effect is placed where it lands, on the floor:
; its light is put two metres over that, a pool on the floor about it. (Put
; at the floor itself, as it first was, it lit no floor at all.) The shafts
; its makers drew gold (fxe_sunbeam_*) are turned pale to match: their glow
; and beams by the colours the rooms give them, their dust by the tower's
; copy of the effect.
; (The cold ones are placed where they come in, twenty metres up: the last
; number has the light put over the floor straight under them.)
; (At 4, 5.6, 9 with its beam drawn at 0.7, 0.9, 1.6 it was "a little too
; blue": a paler light and a paler beam.)
flame = sunbeam:5.5,6.5,8.0:24:2.0:0.5:1
flame = moonbm:5.5,6.5,8.0:24:2.0:0.5:1
param = lava_add_color:0.45,0.2,0.05
param = fxe_glow_color:0.8,0.9,1.15
param = fxe_startbeam_color:0.8,0.9,1.15
param = fxe_endbeam_color:0.8,0.9,1.15
param = Dust_color:0.8,0.9,1.15
model = fxe_sunbeam_s_p:fxe_lunbeam_s_p:dust:0.75,0.9,1.4
