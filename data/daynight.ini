; Where the day and night cycle runs, and how its sun and moon go (DayNight.cpp), by area tag.
; Read as the plugin starts. An area not here keeps its own light.
;
; A section is an area's tag; [defaults] gives what an area does not say. Keys:
;   level        the area's level (its day level), as its .are names it
;   night        the level its night is taken from: its moon, its sky and its sky's light, its cube
;   latitude     degrees, or a level: the latitude at which that level's sun is an equinox's noon
;                (90 less its height)
;   moon_height  degrees up at midnight; default the night level's own moon's
;   moon_turn    degrees about the upright from the night level's own moon; default 0
;   declination  the sun's, in degrees: how far north of the sky's equator it is, the season
;   noon         the hour the sun is highest
;   night_fill   how much of the night level's sky light the night keeps beside the moon, what lights the
;                moon's shadows: set so that shadows are about as dark in every area as in Redcliffe's
;   fires        ([defaults] only) the starts of the names of layouts' lights that are fires, which keep
;                their light by night; every other layout light goes with the sun
;
; The sun and the moon go round one pole on the latitude's path, the moon highest at midnight. The day
; level's sun stands where the level has it at the afternoon hour it is that high, and the level's own
; light, its bake's, is that hour's (the user, 2026-10-22: "perhaps the default isn't noon, but something
; more like 10:AM or 3:PM").

[defaults]
; An early summer's sun. The village's noon sun (38 degrees up) gives the latitude as an equinox's noon
; (52 degrees), and an equinox's sun set at 18:00: at 19:00 it was 9 degrees under, the level in deep
; dusk, "way too dark for 7:00 PM" (the user, 2026-10-22, who chose summer days). At 18 degrees it is 56
; up at noon, higher than the level's own.
declination = 18
; A summer's clock, an hour on from the sun's (as clocks keep summer time). At 12 it rose about 04:20 and
; at 4:00 the morning was light already (the user, 2026-10-22: "sun rises too early"); at 13 it rises
; about 05:20 and sets about 20:40.
noon = 13
; One latitude for the whole world, Redcliffe's: an area's own sun gives its own (its height is 13 to 65
; degrees, so 25 to 77 north), and a sunset's hour would differ between areas, as the castle's did from the
; village's (the user, 2026-10-22: "match up the time based on the elevation of the Sun"). Each level's
; own sun stands at the hour it is that high on this latitude (issue 37).
latitude = lak100d
; The moon lights the night, and the night sky, a dim light of its own, keeps what the moon does not reach
; from black. With none the shadows were pitch black, figures lost in them and the game's highlight of what
; can be used (Tab) gone with them; at 0.15 they were still "maybe too dark" (the user, 2026-10-22, in
; Redcliffe's village). Redcliffe's shadows are the measure for every area (the user, 2026-10-23: "we want
; the shadows to be about as dark everywhere").
night_fill = 0.4
; The castle's layouts light its torches (torch_baked, torch_animated) beside the makers' sunlight
; (Sunhighlight) and a bounce of the day's sky (amb_bounce_RT), which go with the sun as the village's
; Hotspots do (ghilana, 2026-10-22). Lothering's (hrt000d) name theirs fire_: its refugee bonfire's
; (fire_big_001_RT, 12 m) and a lamp's (fire_lamp_), beside its sun_bounce, vista_sun_bounce and
; amb_bounce; under `torch` alone they went with the sun, and the bonfire lit nothing at night (the user,
; 2026-10-23: "fire gives off no light").
fires = torch fire

; A level is the ground of several areas, and the story has its own times in the others: lak100d is the
; village and the climax's and the epilogue's Redcliffe (cli100ar, epi200ar), lak200d the castle's
; courtyard and the climax's (cli150ar) (ghilana, 2026-10-22; the user, 2026-10-22: "certain areas /
; times should not change for story reasons"). Only the areas here run the clock.

; Redcliffe's village, a day and a night level of the same ground (#31).
[arl100ar_redcliffe_village]
level = lak100d
night = lak100n

; Redcliffe castle's courtyard (#35). It has no night level and takes the village's, the same valley a
; walk away; it is reached only after the village's night battle.
; Its moon: the village's, 28 degrees up, stands behind the keep, and the courtyard was all in its
; shadow, 2 of 255 at midnight; at 65 degrees from the other side the keep's front, the yard and the
; gate's lane are lit, 31 (tried at 28, 50 and 70 degrees, turned 0, 90 and 180, 2026-10-22). The two
; are a load apart and each keeps its own (the user, 2026-10-22: "make them separate"). 65 at midnight
; is a winter full moon's height, with a summer's sun: kept for the yard's light (the user, 2026-10-23:
; "that's fine for now").
[arl200ar_redcliffe_castle]
level = lak200d
night = lak100n
moon_height = 65
moon_turn = 180

; Lothering (#38): no night level of its own; Redcliffe's night, a few days' walk away. Visited once,
; before it is overrun.
; Its shadows by night: with the moon off (outdoors.tune's Night = 0), five street views a house or two away,
; the mean grey of each frame's lower half: Redcliffe's village 1.8 at 0.4; Lothering 1.1 at 0.4, 1.9 at
; 0.5, 2.7 at 0.6, 4.4 at 0.8 (2026-10-23). Its wood and thatch are darker than the village's plaster.
[lot100ar_lothering]
level = hrt000d
night = lak100n
night_fill = 0.5
