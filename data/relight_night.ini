; An interior's night by its own lamps and candles (data/night, NightLightmaps.h): what the
; relighter (elgarashaders_relight <game> <level> <out> data/relight_night.ini) bakes a level
; with for the night lightmaps the plugin blends to as the daylight goes. data/relight.ini
; is the levels lit again whole, of 2026-10-11, the moon through the windows among them;
; here nothing but the fittings: no window, no sky, no moon (so no beam= or sky= line; the
; moon's is the makers' bake kept under these, data/areas' fill), nothing of vanilla's
; kept and nothing matched to it, the light as bright as the fittings make it (the user,
; 2026-10-29: "candles don't actually have light"; "i wonder if we can take the old
; lighting work and leverage it in the new day / night cycle").
;
; The fittings by kind and strength, the reach and how far above its place a fire burns,
; as data/relight.ini's [default] says why.

