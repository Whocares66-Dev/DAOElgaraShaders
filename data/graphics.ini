; The looks of Elgara Shaders. Each [name] is a stop of the Look slider on
; the options screen's Video tab, and has how much of each change there is.
; Edit the numbers with the game running: the file is read again when it is
; saved, and the picture follows within half a second. A look added or taken
; out shows on the slider from the next start of the game.
;
;   Sharpen          0 to 1: how much the picture is sharpened
;   Vibrance         0 to 2: saturation given to the colours that have least
;   Contrast         0 to 1: of an S-curve over the middle tones
;   Highlights       0 to 1: with the scene drawn into a 16-bit target, how
;                    far what is brighter than white is rolled off, its
;                    colour kept, and not cut; 0 cuts, as 8 bits do
;   Exposure         -3 to 3: stops an area with a sun is opened up by
;                    before its highlights are rolled off, each a doubling
;                    of its light; 0 is the scene as it is lit. An area with
;                    no sun is left as its makers lit it
;   InteriorExposure -3 to 3: the same for a level with no sun that has
;                    been lit again by its own lamps and candles (relight.ini):
;                    such a room is as dark as its lights leave it, and this
;                    is how far the picture is opened up for it
;   InteriorAdapt    0 to 1: how far a level lit again is exposed for how dark
;                    it is itself, beside InteriorExposure: 1 is all the stops
;                    between its light and the Circle tower's. At a half,
;                    Orzammar's Commons was "way too bright"
;   RelitFog         0 to 1: how much of its area's fog a level lit again
;                    keeps, as a dark haze over what is far (its cap by this
;                    share, its colour dimmed): 0 is none, and the far side
;                    of a great cave is then as crisp as the near
;   StillMost        0 up: in a level lit again, a door, a chest or a banner
;                    is lit by the mean light of its level's probes, and no
;                    probe counts in that mean for more than this much of
;                    white: the few by a fire or over lava would make it a
;                    bright one
;   Bloom            0 to 4: how much of a glow there is about what is
;                    brighter than the picture holds: a fire, a spell, the
;                    sky behind a roof, snow in the sun. 0 for none; the
;                    game's own bloom is another thing and stays
;   Fire             0 to 6: how much brighter than its picture what burns
;                    is: a fire, a spell, lava. The game draws a flame no
;                    brighter than a white wall; at 2 its heart is three
;                    times that, which the picture rolls off to white and
;                    the glow spreads. 0 is the game's own
;   Occlusion        0 to 6: how dark the ambient occlusion is, 0 for none
;   OcclusionRadius  0.1 to 3: metres around a point that can shade it
;   Sun              0 to 6: how much stronger the area's sun is on the ground
;                    and buildings: 1 is twice the area's own, 0 the area's own.
;                    The area's own is hardly brighter than its shade, which
;                    is what makes a day out of doors flat; at 3 the sun is
;                    the light and the shade is shade. The brightness that
;                    comes out white in the picture grows with it
;   SunOnFigures     0 to 3: the same for the sun on figures
;   Haze             0 to 2: how much of the sun's light is in the fog and
;                    the haze of the distance, in the sky's colour; the area
;                    gives them a colour of its own, and 0 is that
;   CoolShade        0 to 1: how far the light of the shade out of doors is
;                    the sky's colour, against the sun's warm one. 0 is the
;                    area's own, which is one colour for both
;   Clouds           0 to 1: how far the clouds are lit by the sun, and how
;                    much thinner they are; 0 is the area's own
;   SunHaze          0 to 4: how brightly the air is lit by the sun: haze
;                    that glows towards the sun and is dull away from it, by
;                    how much air a thing is seen through. 0 for none
;   Shafts           0 to 8: how bright the shafts of light are that the
;                    sun throws past what stands before it, seen looking
;                    towards it. 0 for none
;   Clear            0 to 1: how much of the area's fog is taken away, so
;                    (0 in every look since 2026-10-11: with the far haze
;                    gone a landscape is bare, its lake a flat blue to the
;                    far shore: "no distant fog is ... up landscapes")
;                    that what is far off is seen; 0 is the area's own
;   Sky              0 to 1: how far the engine's own sky, its reckoning of
;                    air and haze under the area's sun, is shown where the
;                    area all but hides it; 0 is the area's own
;   Relief           0 to 3: how strongly the light baked into a level is
;                    shaped by the surfaces' normal maps, so that bricks,
;                    planks and stones show in shade and indoors as they do
;                    in the sun. A flat stretch stays as bright as it was
;   LightContrast    0 to 2: how much the contrast of the light baked into
;                    a level is raised: light brighter than LightPivot is
;                    made brighter and dimmer light dimmer, so that a lamp
;                    lights its part of a room and leaves the rest in
;                    shade. 0 is the game's own
;   LightPivot       0 to 1: the brightness of baked light that stays as
;                    it is. 0 for the level's own middle, which is measured
;                    as its light probes are baked, so that a room keeps the
;                    brightness it was made with
;   LampsOnLevel     0 to 6: how much stronger a level's own lamps, its
;                    torches, fires and braziers, are on its walls, floors
;                    and furnishings: 1 is twice. They are real lights and
;                    light what is near them by the way it faces
;   AmbientLess      0 to 1: how much is taken off the one flat colour a
;                    level adds to everything in it, where the area has no
;                    sun: it is what makes a hall lit by fire as even as
;                    one lit by a window. 0 is the area's own
;   BakedLess        0 to 1: how much of the light baked into a level is
;                    taken away, which leaves the level to its real lights:
;                    for seeing what those are
;   Materials        0 to 1: how far armour and weapons are lit as what they
;                    are: metal scatters less light of its own and mirrors
;                    more of its surroundings, sharper highlights are
;                    brighter. Not with the 16-bit scene off (a file named
;                    own-scene holding the word off, beside the DLL)
;   ShadowOnFigures  0 to 1: how much of the sun's shadow falls on figures:
;                    a building's or a tree's, not their own
;   KeyLess          0 to 1: how much is taken off the light an area with
;                    no sun has for its figures alone, to show them off by:
;                    it is what leaves them bright in a dark room
;   Lamps            0 to 1: how much a figure is lit by the lamps of the
;                    room it stands in, 0 for not at all, which is vanilla
;                    (it lights its walls by them and its figures never),
;                    and 1 for as the engine would. With lamps a figure
;                    takes those that light it before the fills. At 1 skin
;                    beside a lamp is white
;   FillsLess        0 to 1: how much is taken off the fill lights the
;                    engine stands far off to light every figure of an
;                    area alike, where the area has no sun. They are what
;                    makes figures flat; at 1 a figure indoors is lit by
;                    the lamps about it and the room's own light alone,
;                    which is right in the Circle and wrong in the Dead
;                    Trenches, whose ambient light is orange in a pale
;                    room
;   Ambient          0 up: how much more of its ambient light a figure
;                    takes where the area has no sun, 2 for three times.
;                    That light is the room's, by the light probe the
;                    engine chooses a figure where it stands, and takes
;                    the fills' part where no lamp reaches
;   ProbeBlend       0 or 1: at 1 a figure's ambient light is a mix of
;                    the nearest few light probes of its room, by how near
;                    each is, and changes smoothly as it walks; and the
;                    probes are the plugin's own (its probes folder: many
;                    to a room, baked from the level's lightmaps) for the
;                    levels it has them for. At 0 it is the one probe the
;                    level has for the room, the same in its darkest
;                    corner as under its lamps, which is vanilla
;   Anisotropy       0 to 16: anisotropic filtering of textures seen at a
;                    slant, which the game has no setting for; 0 is the
;                    game's own filtering

