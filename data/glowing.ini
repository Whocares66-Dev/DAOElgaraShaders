; The layers of a level's terrain palette that give off light of their own: lava. A terrain material draws
; its ground from a palette of eight layers in a grid of two across and four down (layer 0 the top left,
; 1 the top right, 2 the next row's left and so on), blended by its masks; a layer named here is drawn at
; its own colour times its strength, lit by nothing, whatever the hour (shaders/glow.hlsl), beside the light
; that falls on it. Read as the plugin starts (src/Glowing.cpp).
;
; <palette texture> = <layer> <strength> [<layer> <strength> ...] ; why

; Haven's mountain top (lak403d): its top left layer is cracks of molten lava in dark rock, which by
; night went as dark as the rock (the user, 2026-10-23: "let's also make the lava glow").
lak403d__pal.dds = 0 1
