# The guide's site: Just the Docs, as the other DAO repositories' are (DAOPhotoCam's, 2026-10-15).
# Its pages are index.md and the pages beside it, written by hand; its pictures are the game's own
# frames (assets/img, README.md).
title: Elgara Shaders
description: Better materials, lighting, day/night cycles, and anti-aliasing for Dragon Age Origins, a DAOLib plugin.
url: https://whocares66-dev.github.io
baseurl: /DAOElgaraShaders
remote_theme: just-the-docs/just-the-docs@v0.12.0
color_scheme: elgara
permalink: pretty
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-include-cache
search_enabled: true
search:
  heading_level: 3
  previews: 3
  button: false
heading_anchors: true
back_to_top: true
back_to_top_text: Back to top
aux_links:
  GitHub: https://github.com/Whocares66-Dev/DAOElgaraShaders
defaults:
  - scope:
      path: ""
    values:
      layout: default
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
